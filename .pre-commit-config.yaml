# Local gates that mirror CI, so a broken commit never reaches a PR.
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces in Markdown are a hard line break, not whitespace to
        # clean up. Without this flag the hook silently rewrites the document: the
        # line joins with the next one and the rendered output changes. Caught the
        # first time these hooks were actually run, on a real evals write-up.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
      - id: terraform_checkov
        args: [--args=--quiet, --args=--compact]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Same ruff, same version as the CI job. Without this, pre-commit passes locally
  # and CI fails on lint — which is precisely what happened when the LocalStack
  # tests were added: eleven hooks green here, four ruff findings on the runner.
  # Local gates that do not mirror CI teach people to ignore them.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
